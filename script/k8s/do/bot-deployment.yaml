apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bot
  template:
    metadata:
      labels:
        app: bot
    spec:
      initContainers:
      - name: bot-db-migrations
        image: registry.digitalocean.com/penalty-bot-registry/sqlmigrate:0.1.0
        volumeMounts:
        - name: db-migrate-config-volume
          mountPath: /app/config
      containers:
      - name: bot
        image: registry.digitalocean.com/penalty-bot-registry/bot:0.1.2
        command: ["/app/bot"]
        args: ["-config", "/app/config/config-bot.yaml"]
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      volumes:
      - name: config-volume
        configMap:
          name: bot-cm
      - name: db-migrate-config-volume
        configMap:
          name: sqlmigrate-cm




