apiVersion: apps/v1
kind: Deployment
metadata:
  name: outboxpoller-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: outboxpoller
  template:
    metadata:
      labels:
        app: outboxpoller
    spec:
      initContainers:
      - name: outboxpoller-db-migrations
        image: registry.digitalocean.com/penalty-bot-registry/sqlmigrate:0.1.0
        volumeMounts:
        - name: db-migrate-config-volume
          mountPath: /app/config
      containers:
      - name: outboxpoller
        image: registry.digitalocean.com/penalty-bot-registry/outboxpoller:0.1.0
        command: ["/app/outboxpoller"]
        args: ["-config", "/app/config/config-outboxpoller.yaml"]
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"
      volumes:
      - name: config-volume
        configMap:
          name: outboxpoller-cm
      - name: db-migrate-config-volume
        configMap:
          name: sqlmigrate-cm
