# Default values for bot.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

dbmigration:
  name: "sqlmigrate"
  image:
    repository: "sqlmigrate"
    tag: "0.1.2"

image:
  repository: "bot"
  tag: "0.1.2"

ports:
- name: http
  containerPort: 80
  protocol: TCP

service:
  type: LoadBalancer
  ports:
  - name: http
    port: 443
    targetPort: 80
    protocol: TCP

resources:
  requests:
    memory: "32Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "200m"

bot:
  token: "telegram bot api token"

postgres:
  connStr: "host=postgres-service port=5432 user=bot password=bot dbname=bot sslmode=disable"
