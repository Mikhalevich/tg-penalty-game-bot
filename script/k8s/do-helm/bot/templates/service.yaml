apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-service
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 12 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.ports }}
  ports:
    {{- toYaml . | nindent 12 }}
  {{- end }}
  selector:
    app: {{ .Chart.Name }}
