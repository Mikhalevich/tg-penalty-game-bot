# Default values for bot.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: "registry.digitalocean.com/penalty-bot-registry/redirectionbot"
  tag: "0.4.0"

resources:
  requests:
    memory: "32Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "200m"

bot:
  token: "telegram bot api token"
