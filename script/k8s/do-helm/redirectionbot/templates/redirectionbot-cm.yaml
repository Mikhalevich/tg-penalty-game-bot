apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-cm
data:
  config-redirectionbot.yaml: |
    log_level: "info"
    tracing:
      endpoint: "jaeger-service:4318"
      service_name: "redirection-bot"
    bot:
      token: {{ .Values.bot.token }}
    redirection_link: "https://t.me/SoccerPenaltyBot"