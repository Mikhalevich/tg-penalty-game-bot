# Default values for bot.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

dbmigration:
  name: "sqlmigrate"
  image:
    repository: "registry.digitalocean.com/penalty-bot-registry/sqlmigrate"
    tag: "0.1.3"

image:
  repository: "registry.digitalocean.com/penalty-bot-registry/outboxpoller"
  tag: "0.1.3"

resources:
  requests:
    memory: "32Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "200m"

bot:
  token: "telegram bot api token"

postgres:
  connStr: "pg connection string"
